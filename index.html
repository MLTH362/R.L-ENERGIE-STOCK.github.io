<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>💸 Mon Compteur d'Argent</title>
<style>
body {
  font-family: Arial;
  text-align: center;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  color: white;
}

.container {
  margin-top: 50px;
}

h1 {
  font-size: 2.5em;
}

.money {
  font-size: 3em;
  margin: 20px 0;
  color: #00ff99;
}

input {
  padding: 10px;
  font-size: 1em;
  width: 100px;
  text-align: center;
}

button {
  padding: 10px 20px;
  margin: 10px;
  border: none;
  background: #00aaff;
  color: white;
  font-size: 1em;
  cursor: pointer;
  border-radius: 8px;
}

button:hover {
  background: #0088cc;
}

.progress {
  width: 80%;
  background: #444;
  border-radius: 10px;
  margin: 20px auto;
}

.bar {
  height: 20px;
  width: 0%;
  background: #00ff99;
  border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">
  <h1>💸 Mon Compteur</h1>

  <div class="money" id="total">0 €</div>

  <input type="number" id="amount" placeholder="€">
  <br>
  <button onclick="addMoney()">Ajouter</button>
  <button onclick="reset()">Reset</button>

  <h2>Objectif : 50€</h2>
  <div class="progress">
    <div class="bar" id="bar"></div>
  </div>
</div>

<script>
let total = localStorage.getItem("money") 
  ? parseFloat(localStorage.getItem("money")) 
  : 0;

function update() {
  document.getElementById("total").innerText = total.toFixed(2) + " €";

  let percent = (total / 50) * 100;
  document.getElementById("bar").style.width = percent + "%";

  localStorage.setItem("money", total);
}

function addMoney() {
  let val = parseFloat(document.getElementById("amount").value);
  if (!isNaN(val)) {
    total += val;
    update();
  }
}

function reset() {
  total = 0;
  update();
}

update();
</script>

</body>
</html>
